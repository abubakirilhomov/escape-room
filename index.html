<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escape Room: Secret Laboratory</title>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- ===== ANISAXON: Start Screen ===== -->
  <section id="start-screen" class="fixed inset-0 flex items-center justify-center z-50" style="background: radial-gradient(ellipse at center, #0a1628 0%, #000d1a 60%, #000508 100%); min-height: 100vh;">

    <!-- Orqa fon yulduzlar -->
    <div class="absolute inset-0" style="background-image: radial-gradient(1px 1px at 20% 30%, #67e8f9 0%, transparent 100%), radial-gradient(1px 1px at 80% 10%, #a5f3fc 0%, transparent 100%), radial-gradient(1px 1px at 50% 80%, #67e8f9 0%, transparent 100%), radial-gradient(2px 2px at 60% 20%, #06b6d4 0%, transparent 100%); opacity: 0.3;"></div>

    <!-- Pastki glow -->
    <div class="absolute bottom-0 left-0 right-0 h-64" style="background: linear-gradient(to top, rgba(8,145,178,0.15), transparent);"></div>

    <!-- Asosiy kontent — markazda -->
    <div class="relative z-10 text-center w-full max-w-lg mx-auto px-6">

      <!-- Laboratoriya rasmi -->
      <div class="flex justify-center mb-6">
        <svg width="100" height="100" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="95" rx="28" ry="10" fill="#083344" opacity="0.8"/>
          <path d="M45 30 L45 65 L30 90 Q28 95 35 97 L85 97 Q92 95 90 90 L75 65 L75 30 Z" fill="#0e7490" opacity="0.9"/>
          <path d="M45 30 L45 65 L30 90 Q28 95 35 97 L85 97 Q92 95 90 90 L75 65 L75 30 Z" fill="none" stroke="#22d3ee" stroke-width="2"/>
          <path d="M38 80 L35 90 Q33 95 40 97 L80 97 Q87 95 85 90 L82 80 Z" fill="#0891b2" opacity="0.7"/>
          <circle cx="50" cy="85" r="3" fill="#67e8f9" opacity="0.6"/>
          <circle cx="65" cy="88" r="2" fill="#a5f3fc" opacity="0.5"/>
          <circle cx="72" cy="83" r="2.5" fill="#67e8f9" opacity="0.4"/>
          <rect x="51" y="15" width="18" height="17" rx="2" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>
          <rect x="47" y="12" width="26" height="6" rx="3" fill="#155e75" stroke="#22d3ee" stroke-width="1.5"/>
          <path d="M50 50 Q52 45 54 50" stroke="#a5f3fc" stroke-width="1.5" fill="none" opacity="0.7"/>
        </svg>
      </div>

      <!-- Task 1: Sarlavha -->
      <h1 class="text-5xl font-bold mb-2" style="color:#22d3ee; text-shadow: 0 0 30px #0891b2;">
        Escape Room
      </h1>
      <p class="text-base font-semibold mb-8" style="color:#67e8f9; letter-spacing: 0.3em;">
        SECRET LABORATORY
      </p>

      <!-- Task 2: Hikoya matni paneli -->
      <div class="rounded-xl p-6 mb-8 text-left" style="background: rgba(14, 116, 144, 0.15); border: 1px solid rgba(34,211,238,0.4);">
        <p style="color: white; font-size:0.95rem; line-height:1.6; margin-bottom:0.75rem;">
          <span style="color:#fbbf24; font-weight:600;">⚠️ OGOHLANTIRISH:</span> Siz yer osti laboratoriyasida uyg'ondingiz.
        </p>
        <p style="color: white; font-size:0.95rem; line-height:1.6; margin-bottom:0.75rem;">
          🔊 Sirena ovozi eshitilmoqda. Monitorda <span style="color:#f87171; font-family:monospace; font-weight:700;">"LOCKDOWN"</span> deb miltillayapti.
        </p>
        <p style="color:#fbbf24; font-weight:600; font-size:0.95rem; line-height:1.6;">
          ⏱️ Laboratoriyadan <span style="color:#f87171; font-family:monospace; font-weight:700;">30 daqiqa</span> ichida chiqishingiz kerak!
        </p>
      </div>

      <!-- Task 3: Boshlash tugmasi -->
      <button id="start-button" class="w-full font-bold text-xl py-4 px-12 rounded-xl" style="background: linear-gradient(135deg, #0891b2, #0e7490); border: 1px solid #22d3ee; color: white; box-shadow: 0 0 25px rgba(8,145,178,0.5); cursor: pointer;"
        onmouseover="this.style.boxShadow='0 0 45px rgba(8,145,178,0.9)'; this.style.transform='scale(1.03)'"
        onmouseout="this.style.boxShadow='0 0 25px rgba(8,145,178,0.5)'; this.style.transform='scale(1)'">
        🚀 O'yinni boshlash
      </button>

      <!-- Task 4: Pastki matn -->
      <p class="text-sm mt-6" style="color: rgba(103,232,249,0.5); letter-spacing: 0.05em;">
        Xonalarni tekshiring &nbsp;·&nbsp; Buyumlarni yig'ing &nbsp;·&nbsp; Chiqish yo'lini toping
      </p>

    </div>
  </section>

  <!-- ===== SARVAR: Header va Status Bar ===== -->
  <header id="game-header" class="bg-gray-900 border-b border-gray-700 p-4">
    <!-- TODO: Game title, health display, timer display -->
  </header>

  <!-- ===== MAIN GAME LAYOUT ===== -->
  <main class="max-w-5xl mx-auto p-4 flex flex-col md:flex-row gap-4 mt-4">

    <!-- ===== IBROHIM: Room Panel ===== -->
    <section id="room-panel" class="flex-1" aria-labelledby="room-title">
      <!-- TODO: Room title, description, action buttons -->
    </section>

    <!-- ===== SIDEBAR ===== -->
    <aside class="w-full md:w-72 flex flex-col gap-4">

      <!-- ===== ABDURAHMON: Inventory Panel ===== -->
      <section id="inventory-panel">
        <!-- TODO: Inventory heading, item list, empty state -->
      </section>

      <!-- ===== JAHONGIR: Feedback Panel ===== -->
      <section id="feedback-panel" aria-live="polite">
        <!-- TODO: Feedback heading, message text -->
      </section>

    </aside>
  </main>

  <!-- ===== JAHONGIR: Game Ending Overlay ===== -->
  <section id="game-ending" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <!-- TODO: Ending title, message, restart button -->
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
